[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "opendle-lib"
version = "0.0.0"
description = "Shared Python backend building blocks for OpenDLE projects."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "FSL-1.1-ALv2"
authors = [
  { name = "OpenDLE" },
]
dependencies = []

[project.urls]
Repository = "https://github.com/opendle/opendle-lib"

[dependency-groups]
dev = [
  "hatchling==1.31.0",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.0",
  "twine==6.2.0",
]

[tool.uv]
required-version = "==0.12.0"

[tool.hatch.build.targets.wheel]
packages = ["src/opendle"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/opendle",
  "/LICENSE.md",
  "/README.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.mypy]
files = ["src", "tests", "scripts"]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=opendle",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["opendle"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
